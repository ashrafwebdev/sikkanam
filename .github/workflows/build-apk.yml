name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore shared signing key
        if: env.HAS_KEYSTORE == 'true'
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sikkanam.jks"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        env:
          SIKKANAM_KEYSTORE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/sikkanam.jks', runner.temp) || '' }}
          SIKKANAM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: sikkanam-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Publish the build as a release, so installed copies can see that a newer build exists.
      - name: Publish release
        if: github.event_name == 'push' && env.HAS_KEYSTORE == 'true'
        run: >
          gh release create "build-${GITHUB_RUN_NUMBER}" app/build/outputs/apk/debug/app-debug.apk
          --title "Build ${GITHUB_RUN_NUMBER}" --notes "Automatic build from main."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
