name: Build debug APK

# Runs only when started by hand (Actions tab, Run workflow), not on every push.
# Choose "github" for the GitHub build (it is published as a release) or "play" to check the Play build.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Which build to make'
        type: choice
        options:
          - github
          - play
        default: github

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore shared signing key
        if: env.HAS_KEYSTORE == 'true'
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sikkanam.jks"

      - name: Choose build
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'github' }}"
          echo "FLAVOR=$FLAVOR" >> "$GITHUB_ENV"
          echo "CAP=${FLAVOR^}" >> "$GITHUB_ENV"
          echo "APK_DIR=app/build/outputs/apk/$FLAVOR/debug" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew :app:test${CAP}DebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assemble${CAP}Debug --no-daemon
        env:
          SIKKANAM_KEYSTORE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/sikkanam.jks', runner.temp) || '' }}
          SIKKANAM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: sikkanam-${{ env.FLAVOR }}-debug-apk
          path: ${{ env.APK_DIR }}/*.apk

      # Publish the GitHub build as a release, so installed copies can see that a newer build exists.
      - name: Publish release
        if: env.FLAVOR == 'github' && env.HAS_KEYSTORE == 'true'
        run: >
          gh release create "build-${GITHUB_RUN_NUMBER}" "${APK_DIR}/app-github-debug.apk"
          --title "Build ${GITHUB_RUN_NUMBER}" --notes "Build from main."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
